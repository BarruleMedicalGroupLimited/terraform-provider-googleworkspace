name: Test

# Runs build/fmt/vet/lint/unit-test checks on every push to main and on every
# pull request. Deliberately does not run acceptance tests (`make testacc`) -
# those hit the real Google Workspace Admin SDK API, need live credentials,
# and cost API quota, so they stay a manual/local step (see CONTRIBUTING.md)
# until we have our own dedicated test environment wired up for them.
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # persist-credentials: false - none of these jobs push or need the
      # checkout's token to survive past setup; leaving it persisted in
      # local git config is unnecessary credential exposure to every
      # subsequent step (build tooling, linters, dependencies).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - run: go build ./...

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - run: make fmtcheck

  vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - run: go vet ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: 'go.mod'
          cache: true
      # v7, not v6 - v7 defaults to golangci-lint v2, which is required now
      # that go.mod targets go1.25 (golangci-lint v1's final release,
      # v1.64.8, was built with go1.24 and refuses to analyze a newer
      # module). .golangci.yml is v2-schema as of the same change.
      - uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7.0.1
        with:
          args: --timeout=10m ./internal/provider/...
          # There's a backlog of pre-existing findings from before this
          # workflow existed (deprecated io/ioutil, unchecked errcheck
          # cases, staticcheck SA1019 on the SDK's deprecated retry
          # helpers, various simplification nits - v2's broader default
          # rule set surfaces more of these than v1 did). Rather than fail
          # every build on unrelated debt, only fail on issues introduced
          # by this PR/commit. Clean up the backlog separately, then this
          # can be dropped.
          only-new-issues: true

  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: 'go.mod'
          cache: true
      # make test runs `go test` without TF_ACC set, so every TestAcc* test
      # skips itself - this only exercises the unit tests.
      - run: make test

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-file: 'go.mod'
